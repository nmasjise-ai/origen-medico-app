name: Firestore security rules

on:
  push:
    branches:
      - mejoras-seguridad-origen
      - feature/calendario-inteligente-push
  pull_request:
    branches:
      - main
      - mejoras-seguridad-origen

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Check Vercel Hobby function limit
        run: npm run check:vercel-functions

      - name: Test Firestore rules in the emulator
        run: npm run test:rules

      - name: Build frontend
        run: npm run build
