name: Firestore rules and build

on:
  push:
    branches:
      - mejoras-seguridad-origen
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-and-build:
    name: Firestore tests and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Vercel Hobby function count
        run: npm run check:vercel-functions

      - name: Run Firestore emulator and application tests
        run: npm run test:rules

      - name: Build application
        run: npm run build
